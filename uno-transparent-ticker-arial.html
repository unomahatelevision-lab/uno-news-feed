<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UNO Transparent Headlines</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important}body{display:flex;align-items:flex-end;font-family:Arial,Helvetica,sans-serif}.ticker{width:100%;height:90px;display:flex;align-items:center;overflow:hidden;background:transparent;color:white;position:relative}.track{display:flex;align-items:center;white-space:nowrap;width:max-content;will-change:transform;animation:marquee var(--duration,80s) linear infinite}.group{display:flex;align-items:center;flex-shrink:0}.item{font-family:Arial,Helvetica,sans-serif;font-size:34px;font-weight:700;line-height:1.2;padding-right:70px;text-shadow:0 2px 5px rgba(0,0,0,.85)}.sep{color:white;margin-left:70px}@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}@media(prefers-reduced-motion:reduce){.track{animation:none}}
</style></head><body><div class="ticker" aria-label="UNO news headlines"><div class="track" id="track"><div class="group"><span class="item">Loading UNO News headlines…</span></div></div></div>
<script>
const FEED='https://unomahatelevision-lab.github.io/uno-news-feed/news.csv';
const track=document.getElementById('track');
function parseCSV(text){const rows=[];let row=[],field='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){field+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(field);field=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(field);if(row.some(x=>x.trim()))rows.push(row);row=[];field=''}else field+=c}row.push(field);if(row.some(x=>x.trim()))rows.push(row);if(!rows.length)return[];const headers=rows.shift().map(h=>h.replace(/^\uFEFF/,'').trim().toLowerCase());const idx=headers.indexOf('title');if(idx<0)throw Error('CSV lacks title column');return rows.map(r=>(r[idx]||'').trim()).filter(Boolean)}
function render(titles){track.replaceChildren();const group=document.createElement('div');group.className='group';for(const title of titles.slice(0,20)){const item=document.createElement('span');item.className='item';item.textContent=title;const sep=document.createElement('span');sep.className='sep';sep.textContent='◆';item.appendChild(sep);group.appendChild(item)}track.appendChild(group);track.appendChild(group.cloneNode(true));requestAnimationFrame(()=>{const width=group.getBoundingClientRect().width;track.style.setProperty('--duration',Math.max(20,width/95)+'s')})}
let last='';async function refresh(){try{const res=await fetch(FEED+'?t='+Date.now(),{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);const titles=parseCSV(await res.text());if(!titles.length)throw Error('No headlines found');const key=JSON.stringify(titles);if(key!==last){render(titles);last=key}}catch(e){console.error('UNO feed refresh failed:',e);if(!last)render(['UNO News headlines temporarily unavailable'])}}
refresh();setInterval(refresh,5*60*1000);
</script></body></html>
