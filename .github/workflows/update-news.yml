name: Update UNO News

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uno-news-update
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4

      - name: Fetch UNO News
        run: python fetch_news.py

      - name: Generate RSS feed
        run: python generate_rss.py

      - name: Validate generated files
        run: |
          test -s news.csv
          test -s news.xml
          python - <<'PY'
          import csv
          import xml.etree.ElementTree as ET
          with open('news.csv', newline='', encoding='utf-8-sig') as f:
              rows = list(csv.DictReader(f))
          if not rows:
              raise SystemExit('CSV contains no news items')
          root = ET.parse('news.xml').getroot()
          if root.tag != 'rss' or not root.findall('./channel/item'):
              raise SystemExit('RSS contains no news items')
          print(f'Validated {len(rows)} CSV headlines and RSS items')
          PY

      - name: Commit updated feeds
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add news.csv news.xml
          if ! git diff --cached --quiet; then
            git commit -m 'Update UNO news CSV and RSS feeds'
            git push
          else
            echo 'No feed changes to commit.'
          fi
