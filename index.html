<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UNO News Headlines</title>
<style>
  html,body{margin:0;width:100%;height:100%;background:transparent!important;overflow:hidden}
  body{font-family:Arial,Helvetica,sans-serif}
  #ticker{position:absolute;left:0;right:0;bottom:0;height:64px;overflow:hidden;display:flex;align-items:center;background:transparent}
  #track{display:flex;width:max-content;white-space:nowrap;will-change:transform;animation:marquee var(--duration,60s) linear infinite}
  .group{display:flex;align-items:center;flex:none;white-space:nowrap;color:#fff;font-family:Arial,Helvetica,sans-serif;font-size:34px;font-weight:700;line-height:1.2;text-shadow:0 1px 3px rgba(0,0,0,.65)}
  .headline{padding-right:1.5em}.separator{padding-right:1.5em}
  @keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  #status{display:none}
</style>
</head>
<body>
<div id="ticker"><div id="track" aria-label="UNO News headlines"></div></div>
<div id="status" role="status" aria-live="polite"></div>
<script>
'use strict';
const track=document.getElementById('track');
const status=document.getElementById('status');
let lastSignature='';
function parseCSV(input){
  const rows=[];let row=[],field='',quoted=false;
  for(let i=0;i<input.length;i++){
    const c=input[i];
    if(quoted){if(c==='"'&&input[i+1]==='"'){field+='"';i++;}else if(c==='"'){quoted=false;}else{field+=c;}}
    else if(c==='"'){quoted=true;}
    else if(c===','){row.push(field);field='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&input[i+1]==='\n')i++;row.push(field);if(row.some(v=>v.trim()))rows.push(row);row=[];field='';}
    else{field+=c;}
  }
  row.push(field);if(row.some(v=>v.trim()))rows.push(row);
  return rows;
}
function render(titles){
  const signature=JSON.stringify(titles);
  if(signature===lastSignature)return;
  const makeGroup=()=>{
    const group=document.createElement('div');group.className='group';
    for(const title of titles){
      const headline=document.createElement('span');headline.className='headline';headline.textContent=title;
      const separator=document.createElement('span');separator.className='separator';separator.textContent='◆';
      group.append(headline,separator);
    }
    return group;
  };
  track.replaceChildren();
  const group=makeGroup();track.append(group);
  // Make each repeated group at least one viewport wide for seamless scrolling.
  while(group.getBoundingClientRect().width<window.innerWidth*1.5 && group.children.length<200){
    for(const child of Array.from(group.children).slice(0,titles.length*2))group.append(child.cloneNode(true));
  }
  track.append(group.cloneNode(true));
  const pixels=group.getBoundingClientRect().width;
  track.style.setProperty('--duration',Math.max(20,pixels/95)+'s');
  lastSignature=signature;
}
async function refresh(){
  try{
    const response=await fetch('./news.csv?ts='+Date.now(),{cache:'no-store'});
    if(!response.ok)throw new Error('HTTP '+response.status);
    const rows=parseCSV((await response.text()).replace(/^\uFEFF/,''));
    if(rows.length<2)throw new Error('CSV has no headlines');
    const header=rows.shift().map(s=>s.trim().toLowerCase());
    const titleIndex=header.indexOf('title');
    if(titleIndex<0)throw new Error('CSV has no title column');
    const titles=[...new Set(rows.map(row=>(row[titleIndex]||'').trim()).filter(Boolean))].slice(0,30);
    if(!titles.length)throw new Error('No usable headlines');
    render(titles);
    status.textContent='Updated '+titles.length+' headlines';
  }catch(error){
    console.error('UNO news refresh failed:',error);
    status.textContent='News feed unavailable';
  }
}
refresh();setInterval(refresh,5*60*1000);
</script>
</body>
</html>
